<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退潮之后 · After the Tide — 游戏 × 语言学（第二语言习得）</title>
<meta name="description" content="单场景英语探索：走在退潮后的岸边，点开看见的每件东西，它自己告诉你英文名、读音和释义。CEFR A2–C1。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c0a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c9862f' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0c0b09;--ink2:#131109;--ink3:#1c190f;
  --paper:#e9e3d6;--dim:#a79f8e;--faint:#6d6555;
  --amber:#c98a2c;--rust:#93402f;--sea:#4a6b73;--line:#2b2722;
  --serif:Georgia,"Iowan Old Style","Times New Roman","Songti SC",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper)}
body{font-family:var(--serif);font-size:16.5px;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--ink2);border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.brand i{color:var(--amber);font-style:normal}
.count{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.count b{color:var(--amber);font-weight:400}

.wrap{max-width:900px;margin:0 auto;padding-bottom:90px}
.hero{position:relative}
.hero img{width:100%;height:clamp(160px,27vh,270px);object-fit:cover;object-position:center 62%;filter:grayscale(.12)}
.hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,9,.5),rgba(12,11,9,.96))}
.hero .tt{position:absolute;left:18px;right:18px;bottom:14px}
.hero h1{margin:0;font-size:clamp(28px,7.2vw,52px);line-height:1.05;font-weight:600}
.hero .en{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--amber);margin:8px 0 0}
.hero .tag{font-family:var(--sans);font-size:12.5px;color:#cdc5b4;margin:9px 0 0;padding-left:10px;border-left:2px solid var(--amber);max-width:52ch}

.pad{padding:0 16px}
@media(min-width:760px){.pad{padding:0 30px}}

.intro{margin:24px 0 0;color:#d5cebf;max-width:60ch}
.intro span{display:block;font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:8px}

.spot{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.spot h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
.spot .sub{font-family:var(--sans);font-size:11.5px;color:var(--faint);margin:5px 0 0;line-height:1.6;max-width:58ch}
.things{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0}
@media(min-width:620px){.things{grid-template-columns:repeat(3,1fr)}}
.thing{position:relative;text-align:left;padding:12px 13px;border:1px solid var(--line);background:#100e0a;min-height:70px;transition:border-color .15s}
.thing:hover{border-color:var(--amber)}
.thing .w{display:block;font-size:16.5px;line-height:1.25}
.thing .h{display:block;font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:5px;line-height:1.5}
.thing.done{border-color:rgba(201,138,44,.5);background:rgba(201,138,44,.07)}
.thing.done .w{color:var(--amber)}
.thing .dot{position:absolute;right:11px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--line)}
.thing.done .dot{background:var(--amber)}

.foot{margin:36px 0 0;padding:18px;border:1px solid var(--line);background:var(--ink2)}
.foot h2{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.12em;font-weight:400;color:var(--faint)}
.foot p{margin:0;font-family:var(--sans);font-size:13px;color:var(--dim);line-height:1.7}
.foot .reads{font-family:var(--mono);font-size:12.5px;color:#d8d0bd;line-height:2;margin-top:6px;letter-spacing:.02em}
.foot.done{border-color:var(--amber);background:rgba(201,138,44,.07)}
.foot.done p{color:#ddd5c3}
.nb{margin:12px 0 0;display:none}
.nbrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:12.5px}
.nbrow .x{min-width:110px;font-family:var(--serif);font-size:14.5px}
.nbrow .l{font-family:var(--mono);font-size:9px;color:var(--amber)}
.nbrow .z{color:var(--dim);flex:1}
.toggle{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--amber);border-bottom:1px dashed var(--amber);padding-bottom:1px}

.pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,5,4,.82)}
.pop.on{display:flex}
.card{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:#14110b;border:1px solid var(--amber);padding:22px 22px 18px;animation:up .22s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:29px;line-height:1.1;font-weight:600;letter-spacing:.01em}
.card .lv{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--amber);border:1px solid rgba(201,138,44,.45);padding:3px 6px;white-space:nowrap}
.card .ipa{font-family:var(--mono);font-size:12px;color:var(--dim);margin:7px 0 0}
.card .def{font-family:var(--sans);font-size:13.5px;color:var(--dim);margin:14px 0 0;line-height:1.7;padding-left:11px;border-left:2px solid var(--sea)}
.card .ex{font-size:14.5px;color:#cfc7b6;font-style:italic;margin:14px 0 0;line-height:1.65}
.card .label{margin:14px 0 0;padding:11px 13px;border:1px dashed rgba(201,138,44,.5);font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;color:var(--amber);line-height:1.9}
.card .label u{display:block;font-size:9px;text-decoration:none;color:var(--faint);letter-spacing:.14em;margin-bottom:4px}
.card .close{margin:18px 0 0;width:100%;border:1px solid var(--line);padding:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;min-height:44px}
.card .close:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>

const KEY = "afterthetide_found";
let found = new Set();
try{ found = new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){}
const TOTAL = SPOTS.reduce((n,s)=>n+s.items.length,0);

function render(){
  document.getElementById("cnt").textContent = found.size;
  document.getElementById("tot").textContent = TOTAL;

  document.getElementById("spots").innerHTML = SPOTS.map((s,si)=>`
    <section class="spot">
      <h2>${s.t}</h2>
      <p class="sub">${s.zh} · ${s.sub}</p>
      <div class="things">
        ${s.items.map((it,ii)=>{
          const id = si+"-"+ii;
          return `<button class="thing ${found.has(id)?"done":""}" data-open="${id}">
            <span class="dot"></span>
            <span class="w">${it.w}</span>
            <span class="h">${found.has(id)? it.zh : "点开看它的意思"}</span>
          </button>`;
        }).join("")}
      </div>
    </section>`).join("");

  const labels = [];
  SPOTS.forEach((s,si)=>s.items.forEach((it,ii)=>{ if(it.label && found.has(si+"-"+ii)) labels.push(it.label); }));
  const all = labels.length===4;
  const foot = document.getElementById("foot");
  foot.className = "foot"+(all?" done":"");
  foot.innerHTML = `
    <h2>THE FRAGMENTS · 带字的四片</h2>
    <div class="reads">${labels.length? labels.map(l=>"· "+l).join("<br>"):"（一片都还没读到）"}</div>
    <p style="margin-top:12px">${all
      ? "四片拼起来是一句话：这艘船叫 MERIDIAN，载的是烈酒，在离岸十二海里的地方沉的，而且酒桶上印着 NOT FOR DRINKING。"
      : `读到 ${labels.length} / 4 片。字在物件的标签上，不在你的推理里。`}</p>
    <div class="nb" id="nb"></div>
    <button class="toggle" id="toggle">词袋（${found.size}）</button>
  `;

  document.getElementById("nb").innerHTML = SPOTS.flatMap((s,si)=>s.items.map((it,ii)=>found.has(si+"-"+ii)
    ? `<div class="nbrow"><span class="x">${it.w}</span><span class="l">${it.lv}</span><span class="z">${it.zh}</span></div>` : "")).join("");

  document.getElementById("toggle").onclick = function(){
    const nb = document.getElementById("nb");
    nb.style.display = nb.style.display==="block" ? "none" : "block";
  };
}

function openItem(id){
  const parts = id.split("-").map(Number);
  const it = SPOTS[parts[0]].items[parts[1]];
  found.add(id);
  try{ localStorage.setItem(KEY, JSON.stringify([...found])); }catch(e){}

  document.getElementById("card").innerHTML = `
    <div class="top"><h3>${it.w}</h3><span class="lv">${it.lv}</span></div>
    <p class="ipa">${it.ipa} · ${it.pos} · ${it.zh}</p>
    <p class="def">${it.def}</p>
    <p class="ex">${it.ex}</p>
    ${it.label? `<div class="label"><u>PRINTED ON IT · 上面印着</u>${it.label}</div>`:""}
    <button class="close" data-close>知道了 · 收进词袋</button>
  `;
  document.getElementById("pop").classList.add("on");
  render();
}

document.addEventListener("click", function(e){
  const op = e.target.closest("[data-open]");
  if(op){ openItem(op.dataset.open); return; }
  if(e.target.closest("[data-close]") || e.target.id==="pop"){
    document.getElementById("pop").classList.remove("on");
  }
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") document.getElementById("pop").classList.remove("on"); });

render();
</script>
