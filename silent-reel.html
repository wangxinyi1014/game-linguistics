<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏 × 语言学 · 无声片盘 — 分级词汇的英语侦探游戏（SLA）</title>
<meta name="description" content="游戏 × 语言学（第二语言习得）：一个分级词汇的英语侦探游戏。读台词、查词、取证、指认。CEFR A2–C1，单文件 HTML。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9862f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c9862f'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0d0c0a; --ink2:#14120e; --ink3:#1d1a14; --ink4:#262219;
  --paper:#e9e3d6; --dim:#a79f8e; --faint:#6f6757;
  --amber:#c9862f; --rust:#93402f; --line:#2c2822;
  --serif:Georgia,"Iowan Old Style","Times New Roman","Songti SC",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper)}
body{font-family:var(--serif);font-size:17px;line-height:1.72;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- bar ---------- */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--ink2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rust);box-shadow:0 0 0 3px rgba(147,64,47,.18);flex:none;align-self:center}
.ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--paper);white-space:nowrap}
.sub{font-size:12px;color:var(--faint);white-space:nowrap;letter-spacing:.08em}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.lvls{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.lvls button{padding:6px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim);min-width:44px;min-height:32px}
.lvls button[aria-pressed="true"]{background:var(--ink4);color:var(--amber)}
.ghost{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);padding:7px 10px;border:1px solid var(--line);border-radius:3px;min-height:32px}
.ghost:hover{color:var(--amber);border-color:var(--amber)}
.ghost b{color:var(--amber);font-weight:400}
.prog{height:2px;background:var(--line);position:sticky;top:53px;z-index:39}
.prog i{display:block;height:2px;background:var(--amber);transition:width .5s ease}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);max-width:1120px;margin:0 auto}
@media(min-width:900px){
  .wrap{grid-template-columns:252px minmax(0,1fr);gap:0;padding:0 8px}
  .wrap>aside{border-right:1px solid var(--line);position:sticky;top:56px;align-self:start;max-height:calc(100vh - 70px);overflow:auto}
}
aside{padding:22px 16px 40px;font-family:var(--sans)}
aside h4{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);font-weight:400}
.clues{list-style:none;margin:0 0 26px;padding:0}
.clues li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--dim)}
.clues li.n{color:var(--faint);font-family:var(--mono);font-size:10px;flex:none;padding-top:2px}
.clues li.found{color:var(--paper)}
.clues li.found .n{color:var(--amber)}
.susp{list-style:none;margin:0 0 26px;padding:0}
.susp li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.45}
.susp li span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-top:2px}

/* ---------- stage ---------- */
#stage{padding:26px 18px 90px;min-height:60vh}
@media(min-width:900px){#stage{padding:40px 44px 120px}}
.prose{max-width:62ch}
.scene-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--amber);margin:0 0 4px}
.scene-time{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin:0 0 26px}

.beat{margin:0 0 18px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nar{color:#d6d0c2;font-size:17px}
.say{margin:0 0 18px}
.say .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--amber);display:block;margin-bottom:3px}
.say .line{color:var(--paper);font-size:17px}
.log{margin:0 0 18px;padding:12px 14px;background:#12100c;border-left:2px solid var(--amber);font-family:var(--mono);font-size:12px;line-height:1.7;letter-spacing:.04em;color:#cfc7b2;
  white-space:pre-wrap;overflow-wrap:anywhere}
.log .lt{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--faint);margin-bottom:6px}
.log b{color:var(--amber);font-weight:400}

/* words */
.w{cursor:pointer;border-bottom:1px dashed rgba(201,134,47,.55);padding-bottom:1px}
.w:hover,.w:focus{background:rgba(201,134,47,.12);outline:none}
.w.done{border-bottom-color:rgba(201,134,47,.2);color:#cdc6b6}

/* action row */
.act{margin:26px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 18px;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--paper);background:var(--ink3);min-height:44px}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.pri{background:var(--amber);color:#100d09;border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:#d99a44;color:#100d09}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);margin-left:2px}

/* challenge */
.card{margin:28px 0 0;padding:20px;border:1px solid var(--line);background:var(--ink2)}
.card .q{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--paper);margin:0 0 4px}
.card .subq{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);background:#100e0a;font-family:var(--sans);font-size:13.5px;line-height:1.45;color:#cfc8b8;min-height:44px}
.opt:hover{border-color:var(--amber);color:var(--paper)}
.opt.ok{border-color:var(--amber);background:rgba(201,134,47,.1);color:var(--paper)}
.opt.bad{border-color:var(--rust);color:#c9a499}
.fb{margin:14px 0 0;font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--dim);border-left:2px solid var(--line);padding-left:12px}
.fb.ok{border-color:var(--amber);color:#d8d1c1}

/* clue reveal */
.stamp{margin:26px 0 0;padding:18px;border:1px solid var(--amber);background:rgba(201,134,47,.06);animation:rise .45s ease both}
.stamp .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--amber);display:block;margin-bottom:6px}
.stamp p{margin:0;font-family:var(--sans);font-size:13.5px;line-height:1.6;color:var(--paper)}

/* quiz */
.quiz{margin:24px 0 0}
.qi{padding:16px 0;border-top:1px solid var(--line)}
.qi .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);display:block;margin-bottom:8px}
.qi .q{font-family:var(--sans);font-size:14px;margin:0 0 12px;color:var(--paper);line-height:1.55}

/* suspects grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0 0}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.pick{text-align:left;padding:14px 12px;border:1px solid var(--line);background:#100e0a;min-height:130px}
.pick:hover{border-color:var(--amber)}
.pick.sel{border-color:var(--amber);background:rgba(201,134,47,.1)}
.pick .nm{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--paper);display:block;margin-bottom:2px}
.pick .rl{font-family:var(--sans);font-size:11px;color:var(--amber);display:block;margin-bottom:8px}
.pick .pf{font-family:var(--sans);font-size:11.5px;line-height:1.5;color:var(--dim)}
.ev{display:grid;gap:8px;margin:16px 0 0}
.evopt{text-align:left;padding:10px 12px;border:1px solid var(--line);background:#100e0a;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:#cfc8b8;min-height:44px}
.evopt.sel{border-color:var(--amber);color:var(--paper);background:rgba(201,134,47,.08)}
.evopt .n{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-right:6px}

/* popover */
.pop{position:fixed;z-index:60;max-width:min(360px,calc(100vw - 24px));padding:14px 16px;background:var(--ink3);border:1px solid var(--amber);
  box-shadow:0 14px 40px rgba(0,0,0,.6);animation:rise .2s ease both}
.pop .hw{font-family:var(--serif);font-size:19px;color:var(--paper);margin:0 0 2px}
.pop .ipa{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;margin:0 0 10px}
.pop .lvl{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--amber);border:1px solid rgba(201,134,47,.5);padding:2px 6px;margin-bottom:10px}
.pop .zh{font-family:var(--sans);font-size:13.5px;color:var(--paper);margin:0 0 6px;line-height:1.5}
.pop .def{font-family:var(--sans);font-size:12px;color:var(--dim);line-height:1.55;margin:0}
.pop .saved{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-top:10px;display:block}

/* title */
.hero{position:relative;margin:-26px -18px 0;border-bottom:1px solid var(--line)}
@media(min-width:900px){.hero{margin:-40px -44px 0}}
.hero img{width:100%;height:clamp(210px,37vh,360px);object-fit:cover;filter:grayscale(.35) contrast(1.05);opacity:.82}
.hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,12,10,.2),rgba(13,12,10,.92))}
.tblock{position:absolute;left:22px;right:22px;bottom:18px}
@media(min-width:900px){.tblock{left:44px;right:44px}}
.tblock .kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);margin:0 0 12px;opacity:.95}
.tblock h1{font-size:clamp(34px,8.4vw,68px);line-height:1.02;margin:0;letter-spacing:.02em;font-weight:600;text-shadow:0 2px 28px rgba(0,0,0,.5)}
.tblock .cn{font-family:var(--mono);font-size:11.5px;letter-spacing:.24em;color:var(--amber);margin:14px 0 0;font-weight:400}
.tblock .pos{font-family:var(--sans);font-size:13.5px;letter-spacing:.02em;color:#ded7c6;margin:13px 0 0;padding-left:11px;border-left:2px solid var(--amber);line-height:1.65;max-width:56ch}
.tblock .story{font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:#9d9584;margin:12px 0 0}
.lede{max-width:54ch;margin:26px 0 0;color:#cfc8b8;font-size:16px;line-height:1.75}
.lede em{color:var(--amber);font-style:normal}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:26px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
.meta b{color:var(--dim);font-weight:400}
.how{margin:30px 0 0;padding:16px 18px;border:1px solid var(--line);max-width:62ch;font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--dim)}
.how strong{color:var(--paper);font-weight:500;display:block;margin-bottom:6px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}

/* report */
.rlist{list-style:none;margin:18px 0 0;padding:0;max-width:62ch}
.rlist li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13px}
.rlist li .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);flex:none;width:84px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0 0;max-width:62ch}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px;border:1px solid var(--line);background:var(--ink2)}
.stat .v{font-family:var(--mono);font-size:22px;color:var(--amber);display:block;line-height:1.2}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint);display:block;margin-top:5px}
.nb{max-width:62ch;margin:24px 0 0}
.nbrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nbrow .w2{font-family:var(--serif);font-size:16px;color:var(--paper);min-width:110px}
.nbrow .lv{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--amber)}
.nbrow .zh2{font-family:var(--sans);font-size:12.5px;color:var(--dim);flex:1;min-width:120px}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="dot"></span><span class="ttl">THE SILENT REEL</span><span class="sub">无声片盘</span></div>
  <div class="ctl">
    <div class="lvls" id="lvls" role="group" aria-label="CEFR level"></div>
    <button class="ghost" id="nbBtn">生词本 <b id="nbCount">0</b></button>
  </div>
</header>
<div class="prog" id="progWrap"><i id="progBar" style="width:0%"></i></div>
<main class="wrap">
  <aside id="rail" hidden></aside>
  <section id="stage"></section>
</main>
<div class="pop" id="pop" hidden></div>
<script>
/* =====================================================================
   THE SILENT REEL — a graded-vocabulary detective story
   Single file, no dependencies. Vocabulary tagged A2 / B1 / B2 / C1.
   ===================================================================== */

const LEVELS = ["A2","B1","B2","C1"];
const RANK = {A2:0,B1:1,B2:2,C1:3};

/* ---------- 词表：只收本作正文里出现的词 ---------- */
const WORDS = {
  "booth":{l:"B2",ipa:"/buːð/",zh:"（录音）隔音间",en:"a small enclosed room used for recording"},
  "script":{l:"B1",ipa:"/skrɪpt/",zh:"剧本；台词本",en:"the written text of a film, with the dialogue"},
  "producer":{l:"B1",ipa:"/ˈprɒdjuːsə/",zh:"制片人",en:"the person who controls the money and schedule of a production"},
  "master":{l:"B2",ipa:"/ˈmɑːstə/",zh:"母带（原始录音）",en:"the original recording from which copies are made"},
  "track":{l:"B1",ipa:"/træk/",zh:"音轨",en:"a single recorded layer of sound"},
  "hiss":{l:"C1",ipa:"/hɪs/",zh:"（录音的）嘶嘶底噪",en:"a steady high sound, like a long 's', heard on old tapes"},
  "noise":{l:"A2",ipa:"/nɔɪz/",zh:"噪音",en:"unwanted sound"},
  "degausser":{l:"C1",ipa:"/diːˈɡaʊsə/",zh:"消磁器",en:"a machine that erases a tape with a strong magnetic field"},
  "steady":{l:"B2",ipa:"/ˈstedi/",zh:"稳定的；手的力道稳的",en:"not shaking; controlled"},
  "splice":{l:"B2",ipa:"/splaɪs/",zh:"接片（把两段磁带接起来）",en:"a join between two pieces of tape"},
  "chew":{l:"B1",ipa:"/tʃuː/",zh:"（机器）绞坏",en:"if a machine chews tape, it pulls it in and damages it"},
  "head":{l:"B2",ipa:"/hiːd/",zh:"（磁带机的）磁头",en:"the part of a tape machine that reads or writes sound"},
  "dropout":{l:"C1",ipa:"/ˈdrɒpaʊt/",zh:"信号丢失（磁带上短暂无信号）",en:"a moment when the sound briefly disappears from a tape"},
  "frame":{l:"B1",ipa:"/freɪm/",zh:"（影像的）画格",en:"one single image in a film"},
  "wipe":{l:"B2",ipa:"/waɪp/",zh:"抹掉、消除（录音）",en:"to erase all the sound or data from a tape"},
  "erase":{l:"B2",ipa:"/ɪˈreɪz/",zh:"抹除",en:"to remove recorded sound completely"},
  "deliberate":{l:"B2",ipa:"/dɪˈlɪbərət/",zh:"有意的、蓄意的",en:"done on purpose"},
  "fault":{l:"B1",ipa:"/fɔːlt/",zh:"故障；过错",en:"something wrong with a machine, or a mistake"},
  "booking":{l:"B1",ipa:"/ˈbʊkɪŋ/",zh:"预约",en:"an arrangement to use a room or seat at a fixed time"},
  "occasionally":{l:"B1",ipa:"/əˈkeɪʒənəli/",zh:"偶尔",en:"sometimes, but not often"},
  "mumble":{l:"C1",ipa:"/ˈmʌmbl/",zh:"含糊地低声说",en:"to speak unclearly, so the words are hard to hear"},
  "kind":{l:"A2",ipa:"/kaɪnd/",zh:"善良的；体贴的",en:"caring about other people"},
  "vault":{l:"B2",ipa:"/vɔːlt/",zh:"库房；带库",en:"a secure room where valuable or archived things are kept"},
  "shelf":{l:"A2",ipa:"/ʃelf/",zh:"架子",en:"a flat board on a wall or in a frame, for putting things on"},
  "reel":{l:"B2",ipa:"/riːl/",zh:"片盘；一盘磁带",en:"a round holder that film or tape is wound around"},
  "bay":{l:"C1",ipa:"/beɪ/",zh:"（库房中的）隔间、档位",en:"a numbered section of a storage room"},
  "badge":{l:"B2",ipa:"/bædʒ/",zh:"工牌；门禁卡",en:"a small card you wear or swipe to prove who you are"},
  "temporary":{l:"B2",ipa:"/ˈtempərəri/",zh:"临时的",en:"lasting only for a short time"},
  "unattended":{l:"B2",ipa:"/ˌʌnəˈtendɪd/",zh:"无人看管的",en:"left alone, with nobody watching or responsible for it"},
  "pilot":{l:"B2",ipa:"/ˈpaɪlət/",zh:"试点（项目或系统）",en:"a first trial version of a system, used to test it"},
  "synthetic":{l:"B2",ipa:"/sɪnˈθetɪk/",zh:"合成的",en:"made by a machine, not natural"},
  "inference":{l:"C1",ipa:"/ˈɪnfərəns/",zh:"（模型的）推理",en:"the process by which a trained model produces an output"},
  "hedge":{l:"B2",ipa:"/hedʒ/",zh:"模糊语（缓和语气的话）",en:"a word or phrase that makes a statement less direct"},
  "right":{l:"A2",ipa:"/raɪt/",zh:"（口语）对吧、嗯",en:"used in speech to check agreement or to fill a pause"},
  "quiet":{l:"A2",ipa:"/ˈkwaɪət/",zh:"安静的",en:"making little or no sound"},
  "client":{l:"B1",ipa:"/ˈklaɪənt/",zh:"客户",en:"the company or person paying for the work"},
  "canteen":{l:"B1",ipa:"/kænˈtiːn/",zh:"食堂",en:"a room in a workplace where people eat"},
  "fridge":{l:"A2",ipa:"/frɪdʒ/",zh:"冰箱",en:"a cold cupboard for keeping food fresh"},
  "toast":{l:"A2",ipa:"/təʊst/",zh:"烤面包",en:"bread heated until it is brown and crisp"},
  "rota":{l:"C1",ipa:"/ˈrəʊtə/",zh:"排班表",en:"a list showing who works when"},
  "runner":{l:"B2",ipa:"/ˈrʌnə/",zh:"（片场的）杂务助理",en:"a junior assistant who carries and fetches things on set"},
  "bin":{l:"A2",ipa:"/bɪn/",zh:"垃圾桶",en:"a container for rubbish"},
  "print":{l:"A2",ipa:"/prɪnt/",zh:"打印",en:"to put text from a computer onto paper"},
  "licence":{l:"B2",ipa:"/ˈlaɪsəns/",zh:"授权书；许可证",en:"an official document giving permission to use something"},
  "consent":{l:"B2",ipa:"/kənˈsent/",zh:"（本人的）同意、许可",en:"permission that someone gives for something to be done"},
  "signature":{l:"B1",ipa:"/ˈsɪɡnətʃə/",zh:"签名",en:"your name, written by your own hand"},
  "performer":{l:"B1",ipa:"/pəˈfɔːmə/",zh:"表演者；演员",en:"a person who acts, sings or plays for an audience"},
  "formal":{l:"B1",ipa:"/ˈfɔːml/",zh:"正式的",en:"used in serious or official situations"},

  if(saved.nb) S.nb = saved.nb;
}catch(e){}

const el = id => document.getElementById(id);
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 词形还原 ---------- */
function lookup(surface){
  const w = surface.toLowerCase().replace(/[’]/g,"'");
  const cands = [w];
  if(w.endsWith("ies")) cands.push(w.slice(0,-3)+"y");
  if(w.endsWith("es")) cands.push(w.slice(0,-2), w.slice(0,-1));
  if(w.endsWith("ed")){ cands.push(w.slice(0,-2), w.slice(0,-1)); if(w.length>4 && w[w.length-3]===w[w.length-4]) cands.push(w.slice(0,-3)); }
  if(w.endsWith("ing")) cands.push(w.slice(0,-3), w.slice(0,-3)+"e");
  if(w.endsWith("s")) cands.push(w.slice(0,-1));
  for(const c of cands){ if(WORDS[c]) return {key:c, data:WORDS[c]}; }
  return null;
}

/* ---------- 词级标注 ---------- */
function fmt(text){
  return text.split(/([A-Za-z][A-Za-z'’\-]*)/).map(part=>{
    if(!/[A-Za-z]/.test(part)) return esc(part);
    const hit = lookup(part);
    if(hit && RANK[hit.data.l] > RANK[S.level]){
      const cls = S.nb[hit.key] ? "w done" : "w";
      return `<span class="${cls}" data-w="${hit.key}" tabindex="0" role="button">${esc(part)}</span>`;
    }
    return esc(part);
  }).join("");
}

/* ---------- 步骤 ---------- */
function stepsOf(sc){
  const out = sc.beats.map(b=>({kind:"text", b}));
  out.push({kind:"challenge", d:sc.challenge});
  if(sc.extra) sc.extra.forEach(b=>out.push({kind:"text", b}));
  if(sc.quiz) out.push({kind:"quiz", d:sc.quiz});
  return out;
}

function addClue(id){ if(id && !S.clues[id]) S.clues[id]=true; }

/* ---------- 渲染：条目 ---------- */
function renderBeat(b){
  if(b.t==="nar") return `<p class="beat nar">${fmt(b.x)}</p>`;
  if(b.t==="say") return `<div class="beat say"><span class="who">${esc(b.who)}</span><span class="line">${fmt(b.x)}</span></div>`;
  if(b.t==="log") return `<div class="beat log"><span class="lt">${esc(b.lt||"LOG")}</span>${fmt(b.x)}</div>`;
  if(b.t==="stmt"){
    addClue(b.clue);
    return `<div class="stamp"><span class="k">已记入证据</span><p>${esc(b.x)}</p></div>`;
  }
  return "";
}

function plainBox(sc){
  const p = PLAIN[sc.id]; if(!p) return "";
  return `<div class="how" style="margin:0 0 24px;max-width:none">
    <strong>A2 · 这一段在说什么</strong>
    <div style="color:#d6d0c2;font-family:var(--serif);font-size:15.5px;margin-bottom:6px">${esc(p.en)}</div>
    <div>${esc(p.zh)}</div></div>`;
}

/* ---------- 渲染：挑战 ---------- */
function renderChallenge(sc, i){
  const c = sc.challenge, done = S.chal[sc.id];
  const picked = S.chal[sc.id+":p"];
  let h = `<div class="card"><p class="q">${fmt(c.q)}</p><p class="subq">${esc(c.sub)}</p><div class="opts">`;
  c.opts.forEach((o,k)=>{
    let cls="opt";
    if(done && o.ok) cls+=" ok";
    else if(picked===k && !o.ok) cls+=" bad";
    h += `<button class="${cls}" data-ch="${k}" ${done?"disabled":""}>${esc(o.t)}</button>`;
  });
  h += `</div>`;
  if(picked!==undefined && !done){
    h += `<div class="fb">${esc(c.hint)}</div><div class="act"><button class="btn" data-retry="1">再试一次</button></div>`;
  }
  if(done){
    h += `<div class="fb ok">对。语言先于证据：你听懂了这句话，才拿到这条线索。</div>`;
    const clue = CLUES.find(x=>x.id===c.clue);
    h += `<div class="stamp"><span class="k">EVIDENCE ${clue.id.toUpperCase()} · 已记入证据</span><p>${esc(clue.body)}</p></div>`;
    h += `<div class="act"><button class="btn pri" data-next="1">继续</button></div>`;
  }
  h += `</div>`;
  return h;
}

/* ---------- 渲染：测验 ---------- */
function renderQuiz(sc){
  let h = `<div class="quiz"><p class="scene-head" style="margin-bottom:14px">CHECK · 这一段你读懂了什么</p>`;
  sc.quiz.forEach((q,qi)=>{
    const st = S.qa[sc.si+"-"+qi];
    h += `<div class="qi"><span class="n">${qi+1} / ${sc.quiz.length}</span><p class="q">${fmt(q.q)}</p><div class="opts">`;
    q.opts.forEach((o,k)=>{
      let cls="opt";
      if(st){
        if(k===q.a) cls+=" ok";
        else if(k===st.chosen && !st.ok) cls+=" bad";
      }
      h += `<button class="${cls}" data-qz="${qi}:${k}" ${st?"disabled":""}>${esc(o)}</button>`;
    });
    h += `</div>`;
    if(st) h += `<div class="fb ${st.ok?"ok":""}">${esc(q.why)}</div>`;
    h += `</div>`;
  });
  const all = sc.quiz.every((q,qi)=>S.qa[sc.si+"-"+qi]);
  h += `<div class="act"><button class="btn pri" data-next="1" ${all?"":"disabled style=opacity:.4"}>继续</button></div></div>`;
  return h;
}

/* ---------- 渲染：主视图 ---------- */
function renderRail(){
  const found = Object.keys(S.clues).length;
  let h = `<h4>CASE FILE · 证据 ${found}/6</h4><ul class="clues">`;
  CLUES.forEach((c,i)=>{
    h += `<li class="${S.clues[c.id]?"found":""}"><span class="n">${String(i+1).padStart(2,"0")}</span><span>${S.clues[c.id]?esc(c.short):"—— 尚未发现"}</span></li>`;
  });
  h += `</ul><h4>IN THE BUILDING · 在场四人</h4><ul class="susp">`;
  SUSPECTS.forEach(s=>{ h += `<li>${esc(s.nm)}<span>${esc(s.rl)}</span></li>`; });
  h += `</ul><h4>NOTEBOOK · 生词 ${Object.keys(S.nb).length}</h4>`;
  return h;
}

function renderGame(){
  const sc = SCENES[S.si], steps = stepsOf(sc);
  el("rail").hidden = false;
  el("rail").innerHTML = renderRail();

  let h = `<div class="prose"><p class="scene-head">${esc(sc.head)}</p>
  <p class="scene-time">${esc(sc.time)} · ${esc(sc.cn)} · SCENE ${S.si+1} OF ${SCENES.length}</p>`;
  if(S.level==="A2" && S.plainOpen!==false) h += plainBox(sc);

  for(let i=0;i<=S.step && i<steps.length;i++){
    const st = steps[i];
    if(st.kind==="text") h += renderBeat(st.b);
    else if(st.kind==="challenge") h += renderChallenge(sc, i);
    else if(st.kind==="quiz") h += renderQuiz(sc);
  }

  const cur = steps[S.step];
  if(cur && cur.kind==="text"){
    const last = S.step===steps.length-1;
    h += `<div class="act"><button class="btn pri" data-next="1">${last?"去指认":"继续"}</button>
    <span class="hint">划线虚线词 = 超出你当前级别，点一下看释义</span></div>`;
  }
  h += `</div>`;
  el("stage").innerHTML = h;
  el("progBar").style.width = ((S.si + (S.step+1)/steps.length) / (SCENES.length+0.6) * 100) + "%";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- 渲染：指认 ---------- */
function renderAccuse(){
  el("rail").hidden = false; el("rail").innerHTML = renderRail();
  const found = CLUES.filter(c=>S.clues[c.id]);
  const selEv = S.evSel || [];
  let h = `<div class="prose"><p class="scene-head">V · THE ACCUSATION</p><p class="scene-time">04:10 · 指认</p>
  <p class="nar">The producer will be here at nine. You have one name and two pieces of evidence.</p>
  <div class="grid">`;
  SUSPECTS.forEach(s=>{
    h += `<button class="pick ${S.accuse===s.id?"sel":""}" data-acc="${s.id}">
      <span class="nm">${esc(s.nm)}</span><span class="rl">${esc(s.rl)}</span><span class="pf">${esc(s.pf)}</span></button>`;
  });
  h += `</div><p class="scene-head" style="margin:28px 0 0">EVIDENCE · 选两条</p><div class="ev">`;
  if(!found.length) h += `<p class="nar" style="font-size:14px;color:var(--dim)">你还没有任何证据。回去把话说清楚。</p>`;
  found.forEach(c=>{
    h += `<button class="evopt ${selEv.includes(c.id)?"sel":""}" data-ev="${c.id}"><span class="n">${c.id.toUpperCase()}</span>${esc(c.short)}</button>`;
  });
  h += `</div>`;
  if(S.verdict) h += `<div class="fb ${S.verdict.ok?"ok":""}">${esc(S.verdict.msg)}</div>`;
  const ready = S.accuse && selEv.length===2;
  h += `<div class="act"><button class="btn pri" data-judge="1" ${ready?"":"disabled style=opacity:.4"}>交出结论</button>
  <button class="btn" data-soft="1">再读一遍现场</button></div></div>`;
  el("stage").innerHTML = h;
}

/* ---------- 渲染：真相 ---------- */
function renderEnd(){
  el("rail").hidden = false; el("rail").innerHTML = renderRail();
  el("stage").innerHTML = `<div class="prose">
  <p class="scene-head">THE SOLUTION</p><p class="scene-time">03:55 · 破案</p>
  <p class="nar">Mara puts her coffee down and does not deny it.</p>
  <p class="nar">She had spent two weeks training a synthetic voice on the actor's archive — every take, every mumble, nine series of them. The licence was printed for him to sign after the demo. He had not signed it.</p>
  <p class="nar">The wipe was not sabotage. It was housekeeping: the test reel had to disappear before the client heard what the studio could now do without him.</p>
  <p class="nar">The producer knew. That is why the demo is still booked for nine.</p>
  <div class="stamp"><span class="k">中文</span><p>Mara 没有否认。她用那位主演九季的档案录音，训练了两个星期的合成声音；授权书是为他在演示之后签字准备的，他没有签。抹掉母带不是破坏，是清理——测试盘必须在客户听见之前消失。制片人早就知道，所以九点的演示照旧。</p></div>
  <p class="nar" style="color:var(--amber);margin-top:26px">The case turned on a sentence, not a fingerprint.</p>
  <div class="act"><button class="btn pri" data-report="1">看我的词汇报告</button></div></div>`;
  el("progBar").style.width = "100%";
}

/* ---------- 渲染：报告 ---------- */
function renderReport(){
  el("rail").hidden = true;
  const nb = Object.entries(S.nb);
  const byLevel = {A2:0,B1:0,B2:0,C1:0};
  nb.forEach(([w,l])=>{ if(byLevel[l]!==undefined) byLevel[l]++; });
  const rate = S.qTot ? Math.round(S.qAns/S.qTot*100) : 0;
  let h = `<div class="prose"><p class="scene-head">DEBRIEF</p><p class="scene-time">词汇报告 · 本案结案</p>
  <div class="stats">
    <div class="stat"><span class="v">${nb.length}</span><span class="k">生词本词条</span></div>
    <div class="stat"><span class="v">${S.clicks}</span><span class="k">查词次数</span></div>
    <div class="stat"><span class="v">${rate}%</span><span class="k">理解题正确率</span></div>
    <div class="stat"><span class="v">${S.tries}</span><span class="k">指认尝试</span></div>
  </div>
  <ul class="rlist">
    <li><span class="k">级别</span><span>${S.level} — 高于此级的词才会被标注</span></li>
    <li><span class="k">词级分布</span><span>A2 ${byLevel.A2} · B1 ${byLevel.B1} · B2 ${byLevel.B2} · C1 ${byLevel.C1}</span></li>
    <li><span class="k">证据</span><span>${Object.keys(S.clues).length}/6</span></li>
  </ul>`;
  if(nb.length){
    h += `<p class="scene-head" style="margin:30px 0 0">NOTEBOOK · 你点开的词</p><div class="nb">`;
    nb.sort((a,b)=>RANK[a[1]]-RANK[b[1]]).forEach(([w,l])=>{
      const d = WORDS[w];
      h += `<div class="nbrow"><span class="w2">${esc(w)}</span><span class="lv">${esc(l)}</span><span class="zh2">${esc(d?d.zh:"")}</span></div>`;
    });
    h += `</div>`;
  }else{
    h += `<p class="nar" style="margin-top:24px;color:var(--dim);font-size:15px">这一遍你没有查任何词。换到更低的级别再读一次，或者点开那些你觉得“大概懂”的词——那才是最容易漏的地方。</p>`;
  }
  h += `<div class="act"><button class="btn" data-export="1">导出生词本 .txt</button>
  <button class="btn" data-restart="1">从头再玩一次</button>
  <button class="btn" data-raise="1">升一个级别重读</button></div>
  <p class="hint" style="margin-top:20px;display:block;line-height:1.9">这个 demo 的判据是：一个词理解错，推理就会错。所以词汇不是关卡前的门，它本身就是证据。</p>
  </div>`;
  el("stage").innerHTML = h;
  el("progBar").style.width = "100%";
}

/* ---------- 顶栏 ---------- */
function renderLevels(){
  el("lvls").innerHTML = LEVELS.map(l=>`<button data-lv="${l}" aria-pressed="${S.level===l}">${l}</button>`).join("");
  el("nbCount").textContent = Object.keys(S.nb).length;
}

function render(){
  renderLevels();
  el("nbCount").textContent = Object.keys(S.nb).length;
  if(S.view==="title") renderTitle();
  else if(S.view==="game") renderGame();
  else if(S.view==="accuse") renderAccuse();
  else if(S.view==="end") renderEnd();
  else if(S.view==="report") renderReport();
}

/* ---------- 交互 ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-lv],[data-start],[data-next],[data-ch],[data-retry],[data-qz],[data-acc],[data-ev],[data-judge],[data-soft],[data-export],[data-restart],[data-raise],[data-report]");
  if(t){
    if(t.dataset.lv){ S.level = t.dataset.lv; persist(); render(); return; }
    if(t.dataset.start){ S.view="game"; S.si=0; S.step=0; render(); return; }
    if(t.dataset.next){
      const sc = SCENES[S.si], steps = stepsOf(sc);
      if(S.step+1 >= steps.length){
        if(S.si+1 < SCENES.length){ S.si++; S.step=0; } else { S.view="accuse"; }
      } else S.step++;
      render(); return;
    }
    if(t.dataset.ch!==undefined && t.dataset.ch!==""){
      const sc = SCENES[S.si], k = +t.dataset.ch, o = sc.challenge.opts[k];
      if(o.ok){ S.chal[sc.id]=true; addClue(sc.challenge.clue); delete S.chal[sc.id+":p"]; }
      else { S.chal[sc.id+":p"]=k; }
      render(); return;
    }
    if(t.dataset.retry){ const sc=SCENES[S.si]; delete S.chal[sc.id+":p"]; render(); return; }
    if(t.dataset.qz){
      const sc = SCENES[S.si], [qi,k] = t.dataset.qz.split(":").map(Number);
      const key = S.si+"-"+qi; if(S.qa[key]) return;
      const ok = k===sc.quiz[qi].a;
      S.qa[key] = {chosen:k, ok};
      S.qTot++; if(ok) S.qAns++;
      render(); return;
    }
    if(t.dataset.acc){ S.accuse = t.dataset.acc; S.verdict=null; render(); return; }
    if(t.dataset.ev){
      const id = t.dataset.ev; S.evSel = S.evSel || [];
      if(S.evSel.includes(id)) S.evSel = S.evSel.filter(x=>x!==id);
      else { S.evSel.push(id); if(S.evSel.length>2) S.evSel.shift(); }
      render(); return;
    }
    if(t.dataset.judge){
      S.tries++;
      const sel = S.evSel || [];
      if(S.accuse==="mara" && sel.includes("c5") && sel.includes("c6")){
        S.verdict={ok:true,msg:"成立。语言证据把她放进那间屋子，预约记录把她放在那个时间。"};
        setTimeout(()=>{ S.view="end"; render(); }, 900);
        render();
      }else if(S.accuse==="mara"){
        S.verdict={ok:false,msg:"你有那个人，没有那间屋子。C5 是那句话，C6 是预约记录——两者要一起交。"};
        render();
      }else if(S.accuse==="del"){
        S.verdict={ok:false,msg:"Del 全程都在加模糊语（right, yeah, I mean）。他没有做过任何断言，而配音间的预约栏里没有他的名字。"};
        render();
      }else if(S.accuse==="ivy"){
        S.verdict={ok:false,msg:"Ivy 找到的是授权书，不是抹带的机器。她的语体是提问（yeah? innit?），那十一个词是命令。"};
        render();
      }else{
        S.verdict={ok:false,msg:"Rowan 的工牌刷开了带库，但工牌不是声音。那十一个词里没有一个是术语。"};
        render();
      }
      return;
    }
    if(t.dataset.soft){ S.view="game"; S.si=0; S.step=0; S.verdict=null; render(); return; }
    if(t.dataset.report){ S.view="report"; render(); return; }
    if(t.dataset.restart){
      S.si=0; S.step=0; S.clues={}; S.qa={}; S.chal={}; S.qAns=0; S.qTot=0;
      S.clicks=0; S.tries=0; S.accuse=null; S.evSel=[]; S.verdict=null; S.view="title"; render(); return;
    }
    if(t.dataset.raise){
      const next = LEVELS[Math.min(RANK[S.level]+1, 3)];
      S.level = next; persist(); S.view="game"; S.si=0; S.step=0; S.qa={}; S.chal={}; render(); return;
    }
    if(t.dataset.export){
      const lines = Object.entries(S.nb).sort((a,b)=>RANK[a[1]]-RANK[b[1]])
        .map(([w,l])=>{ const d=WORDS[w]||{}; return `${w}\t${l}\t${d.ipa||""}\t${d.zh||""}\t${d.en||""}`; });
      const body = "word\tlevel\tIPA\t中文\tdefinition\n" + lines.join("\n");
      const blob = new Blob([body], {type:"text/plain;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "silent-reel-notebook.txt";
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    return;
  }

  /* 点词 */
  const w = e.target.closest(".w");
  if(w){ openPop(w, e); return; }
  const pop = el("pop");
  if(!pop.hidden && !e.target.closest("#pop")) pop.hidden = true;
});

function openPop(node, e){
  const key = node.dataset.w, d = WORDS[key]; if(!d) return;
  S.clicks++; if(!S.nb[key]){ S.nb[key] = d.l; persist(); el("nbCount").textContent = Object.keys(S.nb).length; }
  node.classList.add("done");
  const pop = el("pop");
  pop.innerHTML = `<p class="hw">${esc(key)}</p><p class="ipa">${esc(d.ipa)}</p>
    <span class="lvl">${esc(d.l)} · 高于 ${esc(S.level)}</span>
    <p class="zh">${esc(d.zh)}</p><p class="def">${esc(d.en)}</p>
    <span class="saved">已加入生词本</span>`;
  pop.hidden = false;
  const r = pop.getBoundingClientRect();
  let x = (e.clientX||0) + 14, y = (e.clientY||0) + 16;
  if(x + r.width > window.innerWidth - 12) x = window.innerWidth - r.width - 12;
  if(y + r.height > window.innerHeight - 12) y = (e.clientY||0) - r.height - 12;
  pop.style.left = Math.max(12,x) + "px";
  pop.style.top = Math.max(12,y) + "px";
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape") el("pop").hidden = true;
  if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("w")){
    e.preventDefault(); openPop(e.target, {clientX:0,clientY:0});
  }
});

/* ---------- 启动 ---------- */
S.plainOpen = S.level==="A2";
render();
</script>
</body>
</html>
